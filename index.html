<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Budget</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f2f2f7;
            font-family: -apple-system, BlinkMacSystemFont,
                         "SF Pro Display", Arial, sans-serif;
            color: #111;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin: 20px 0 30px;
        }

        .riga {
            background: white;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .nome {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .controlli {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .valore {
            flex: 1;
            text-align: center;
            font-size: 28px;
            font-weight: 600;
        }

        button {
            width: 55px;
            height: 55px;
            border: none;
            border-radius: 50%;
            background: #e5e5ea;
            font-size: 28px;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.92);
            background: #d1d1d6;
        }

        .quantita-box {
            background: white;
            border-radius: 18px;
            padding: 18px;
            margin-top: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .quantita-box label {
            display: block;
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        #quantita {
            width: 100%;
            padding: 12px;
            font-size: 20px;
            border: 1px solid #ccc;
            border-radius: 12px;
            text-align: center;
        }

        .reset {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            margin-top: 20px;
            background: #ffdddd;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>I miei valori</h1>

    <div class="riga">
        <div class="nome">Risparmio</div>

        <div class="controlli">
            <button onclick="modifica('risparmio', -1)">−</button>

            <div class="valore" id="risparmio">0</div>

            <button onclick="modifica('risparmio', 1)">+</button>
        </div>
    </div>


    <div class="riga">
        <div class="nome">Spesi</div>

        <div class="controlli">
            <button onclick="modifica('spesi', -1)">−</button>

            <div class="valore" id="spesi">0</div>

            <button onclick="modifica('spesi', 1)">+</button>
        </div>
    </div>


    <div class="riga">
        <div class="nome">Andati</div>

        <div class="controlli">
            <button onclick="modifica('andati', -1)">−</button>

            <div class="valore" id="andati">0</div>

            <button onclick="modifica('andati', 1)">+</button>
        </div>
    </div>


    <div class="riga">
        <div class="nome">Ultimo preso</div>

        <div class="controlli">
            <button onclick="modifica('ultimo_preso', -1)">−</button>

            <div class="valore" id="ultimo_preso">0</div>

            <button onclick="modifica('ultimo_preso', 1)">+</button>
        </div>
    </div>


    <div class="quantita-box">

        <label for="quantita">
            Quantità da aggiungere/sottrarre
        </label>

        <input
            id="quantita"
            type="number"
            value="1"
            inputmode="decimal"
        >

        <button class="reset" onclick="resetta()">
            Reimposta valori
        </button>

    </div>

</div>


<script>

    const valoriDefault = {
        risparmio: 0,
        spesi: 0,
        andati: 0,
        ultimo_preso: 0
    };


    let valori = JSON.parse(
        localStorage.getItem("miei_valori")
    ) || valoriDefault;


    function aggiornaSchermo() {

        document.getElementById("risparmio").textContent =
            valori.risparmio;

        document.getElementById("spesi").textContent =
            valori.spesi;

        document.getElementById("andati").textContent =
            valori.andati;

        document.getElementById("ultimo_preso").textContent =
            valori.ultimo_preso;
    }


    function modifica(nome, direzione) {

        let quantita = Number(
            document.getElementById("quantita").value
        );

        if (isNaN(quantita) || quantita < 0) {
            quantita = 1;
        }

        valori[nome] += quantita * direzione;

        localStorage.setItem(
            "miei_valori",
            JSON.stringify(valori)
        );

        aggiornaSchermo();
    }


    function resetta() {

        if (confirm("Vuoi davvero reimpostare tutti i valori?")) {

            valori = {
                risparmio: 0,
                spesi: 0,
                andati: 0,
                ultimo_preso: 0
            };

            localStorage.setItem(
                "miei_valori",
                JSON.stringify(valori)
            );

            aggiornaSchermo();
        }
    }


    aggiornaSchermo();

</script>

</body>
</html>
